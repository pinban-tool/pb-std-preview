<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拼板助手 · 标准版 v2</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#243044;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:22px 14px}h1{font-size:25px;margin:0 0 6px}.muted{color:#697589;font-size:13px}.panel{background:white;border:1px solid #e5eaf2;border-radius:17px;padding:18px;margin-top:14px;box-shadow:0 3px 16px #26375b08}.tabs{display:flex;gap:8px;margin-top:18px}.tabs button{flex:1}.tabs .active{background:#365ad9;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;color:#526079;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #d9e0eb;border-radius:9px;background:white;font-size:15px;color:#1f2c40}button{border:0;border-radius:10px;padding:11px 15px;background:#e9edfa;color:#30467e;font-weight:650;cursor:pointer}.primary{background:#365ad9;color:white;width:100%;margin-top:14px;font-size:16px}.danger{color:#ad3745;background:#fff0f0}.item{padding:12px;background:#f7f9fd;border-radius:12px;margin:10px 0}.itemhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e9edf3;padding:9px 5px}svg{max-width:100%;height:auto;border:1px solid #e4e8ef;border-radius:9px;background:#fff}.result{line-height:1.8}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f3f6ff;border-radius:10px;padding:12px}.metric strong{display:block;font-size:22px;color:#365ad9}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.note{font-size:12px;color:#6a7486}.scroll{max-height:340px;overflow:auto}@media(max-width:550px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:13px}h1{font-size:22px}}</style></head><body><main class="wrap"><h1>拼板助手 · 标准版 <small style="font-size:13px;color:#6a7486">v2</small></h1><div class="muted">单尺寸 / 同尺寸多图案 / 混合尺寸 · 全部单位 cm · 保持输入方向，不自动旋转</div><div class="tabs"><button id="tabSingle" class="active" onclick="mode('single')">单尺寸拼版</button><button id="tabSame" onclick="mode('same')">同尺寸多图案</button><button id="tabMixed" onclick="mode('mixed')">混合尺寸拼版</button></div><section class="panel"><h3>画板与排版参数</h3><div class="grid"><div><label>画板宽度 (cm)</label><input id="bw" type="number" value="15" step="any"></div><div><label>画板高度 (cm)</label><input id="bh" type="number" value="15" step="any"></div><div><label>右侧最少留白 (cm)</label><input id="margin" type="number" value="0.2" step="any"></div><div><label>横向间距 (cm)</label><input id="gx" type="number" value="0" step="any"></div><div><label>纵向间距 (cm)</label><input id="gy" type="number" value="0" step="any"></div><div id="tolbox"><label>数量容差 (个)</label><input id="tol" type="number" value="10" step="1"></div></div><p class="note">横向必须预留余量；纵向不超画板。间距指相邻图案之间的净间隔。</p></section><section class="panel" id="single"><h3>单尺寸图案</h3><div class="grid"><div><label>图案宽度 (cm)</label><input id="sw" type="number" value="3.48" step="any"></div><div><label>图案高度 (cm)</label><input id="sh" type="number" value="1.58" step="any"></div><div><label>目标数量 (个)</label><input id="sq" type="number" value="842"></div></div><button class="primary" onclick="calculateSingle()">计算单尺寸拼版</button></section><section class="panel hidden" id="same"><h3>同尺寸 · 多图案混排</h3><p class="muted">各图案宽高相同，分别设置目标数量；同一画板可以混合不同图案。每张板的图案分配可以不同，方向不旋转。</p><div class="grid"><div><label>统一宽度 (cm)</label><input id="sameW" type="number" value="3.48" step="any"></div><div><label>统一高度 (cm)</label><input id="sameH" type="number" value="1.58" step="any"></div></div><div id="sameItems"></div><button onclick="addSameItem()">＋ 添加图案</button><button class="primary" onclick="calculateSame()">计算同尺寸多图案</button></section><section class="panel hidden" id="mixed"><h3>不同尺寸图案</h3><div class="muted">同一画板混排，每种图案分别输入尺寸和需求数量。</div><div id="items"></div><button onclick="addItem()">＋ 添加一种尺寸</button><button class="primary" onclick="calculateMixed()">计算混合尺寸拼版</button></section><section class="panel hidden" id="out"><h3>计算结果</h3><div id="summary" class="result"></div><div id="drawing"></div><div id="boardControls" class="actions hidden"><button onclick="showBoard(-1)">← 上一版</button><span id="boardPosition" style="align-self:center"></span><button onclick="showBoard(1)">下一版 →</button></div><div class="actions"><button onclick="copyResult()">复制计算结果</button><button onclick="exportSVG()">导出排版示意 SVG</button></div><p class="note">示意图仅供核对排布；实际生产仍需检查出血、裁切、安全边距及设备公差。混合尺寸模式使用整行启发式估算，不保证最优版数，也不保证各版一致。</p></section></main><script>let current='single',counter=0,lastText='',lastSvg='';const $=id=>document.getElementById(id),num=id=>Number($(id).value),fmt=x=>Number(x.toFixed(3));function mode(m){current=m;$('same').classList.toggle('hidden',m!=='same');$('tabSame').classList.toggle('active',m==='same');$('boardControls').classList.add('hidden');$('single').classList.toggle('hidden',m!=='single');$('mixed').classList.toggle('hidden',m!=='mixed');$('tolbox').classList.toggle('hidden',m!=='single');$('tabSingle').classList.toggle('active',m==='single');$('tabMixed').classList.toggle('active',m==='mixed');$('out').classList.add('hidden')}function addItem(w='',h='',q=''){if(document.querySelectorAll('#items .item').length>=20)return;counter++;const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="itemhead"><strong>图案 <span class="itemnum"></span></strong><button class="danger" onclick="this.closest('.item').remove();renumber()">删除</button></div><div class="grid"><div><label>宽度 (cm)</label><input class="iw" type="number" step="any" value="${w}"></div><div><label>高度 (cm)</label><input class="ih" type="number" step="any" value="${h}"></div><div><label>需求数量</label><input class="iq" type="number" step="1" value="${q}"></div></div>`;$('items').appendChild(el);renumber()}function renumber(){document.querySelectorAll('.itemnum').forEach((e,i)=>e.textContent=i+1)}addItem('3.48','1.58','100');addItem('2.5','2','80');function params(){let W=num('bw'),H=num('bh'),m=num('margin'),gx=num('gx'),gy=num('gy');if(![W,H,m,gx,gy].every(Number.isFinite)||W<=0||H<=0||m<=0||m>=W||gx<0||gy<0)throw Error('请检查画板、间距和横向预留余量，余量必须大于 0。');return{W,H,m,gx,gy,avail:W-m}}function makeSvg(p,rows){let scale=Math.min(4,540/Math.max(p.W,p.H)),w=p.W*scale,h=p.H*scale;let colors=['#7295ee','#efa97b','#8cc8ac','#c1a1e9','#f2d276','#86c6df'];let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="white"/><rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="#283c5d" stroke-width="1.5"/>`;for(let row of rows){for(let j=0;j<row.n;j++){let x=(row.x+j*(row.w+p.gx))*scale,y=row.y*scale;s+=`<rect x="${x}" y="${y}" width="${row.w*scale}" height="${row.h*scale}" fill="${colors[row.i%colors.length]}" stroke="#334b70" stroke-width=".65"/><text x="${x+row.w*scale/2}" y="${y+row.h*scale/2+3}" text-anchor="middle" font-size="${Math.min(11,row.w*scale/3)}" fill="#213047">${row.i+1}</text>`}}s+='</svg>';return s}function render(text,svg){$('boardControls').classList.add('hidden');lastText=text;lastSvg=svg;$('summary').innerHTML=text.replaceAll('\n','<br>');$('drawing').innerHTML='<h4>单版排布示意</h4>'+svg;$('out').classList.remove('hidden');$('out').scrollIntoView({behavior:'smooth',block:'start'})}function calculateSingle(){try{const p=params(),w=num('sw'),h=num('sh'),q=num('sq'),tol=num('tol');if(!(w>0&&h>0&&Number.isInteger(q)&&q>0&&Number.isInteger(tol)&&tol>=0))throw Error('请填写有效图案尺寸、整数目标数量和容差。');let maxC=Math.floor((p.avail+p.gx+1e-8)/(w+p.gx)),maxR=Math.floor((p.H+p.gy+1e-8)/(h+p.gy));if(maxC<1||maxR<1)throw Error('图案无法放入画板，请调整尺寸。');let options=[];for(let c=1;c<=Math.min(maxC,2000);c++)for(let r=1;r<=Math.min(maxR,2000);r++){let n=c*r,base=q/n;for(let sheets of new Set([Math.max(1,Math.floor(base)),Math.max(1,Math.ceil(base))])){let total=n*sheets,diff=Math.abs(total-q),usedW=c*w+(c-1)*p.gx,usedH=r*h+(r-1)*p.gy;options.push({c,r,n,sheets,total,diff,usedW,usedH,coverage:usedW/p.W,area:usedW*usedH})}}options.sort((a,b)=>(a.diff<=tol?0:1)-(b.diff<=tol?0:1)||b.coverage-a.coverage||a.diff-b.diff||b.area-a.area||a.sheets-b.sheets);let best=options[0],x=(p.W-best.usedW)/2,y=(p.H-best.usedH)/2;let rows=Array.from({length:best.r},(_,i)=>({i:0,n:best.c,x,y:y+i*(h+p.gy),w,h}));let text=`推荐：${best.c} 列 × ${best.r} 行 × ${best.sheets} 版\n每版 ${best.n} 个；总数 ${best.total} 个；与目标相差 ${best.total-q>0?'+':''}${best.total-q} 个\n每版排布尺寸 ${fmt(best.usedW)} × ${fmt(best.usedH)} cm\n画板 ${p.W} × ${p.H} cm；左右各留 ${fmt((p.W-best.usedW)/2)} cm；上下各留 ${fmt((p.H-best.usedH)/2)} cm\n所有版行列、方向和间距一致。`;let alts=options.filter(o=>o.c!==best.c||o.r!==best.r||o.sheets!==best.sheets).slice(0,3);if(alts.length)text+='\n其他方案：'+alts.map(o=>`${o.c}列×${o.r}行×${o.sheets}版=${o.total}个`).join('；');render(text,makeSvg(p,rows))}catch(e){alert(e.message)}}function calculateMixed(){try{const p=params();let a=[...document.querySelectorAll('#items .item')].map((e,i)=>({i,w:Number(e.querySelector('.iw').value),h:Number(e.querySelector('.ih').value),q:Number(e.querySelector('.iq').value)}));if(!a.length||a.some(x=>!(x.w>0&&x.h>0&&Number.isInteger(x.q)&&x.q>0)))throw Error('请填写所有图案的有效尺寸和整数数量。');if(a.some(x=>x.w>p.avail||x.h>p.H))throw Error('有图案尺寸超过可用画板，请检查。');let rem=a.map(x=>x.q),boards=[];for(let k=0;k<1000&&rem.some(x=>x>0);k++){let y=0,rows=[],counts=a.map(()=>0);while(y<p.H-1e-8){let candidates=a.map((v,i)=>{let n=Math.min(rem[i],Math.floor((p.avail+p.gx+1e-8)/(v.w+p.gx)));return n>0&&v.h<=p.H-y+1e-8?{i,n,score:n*v.w*v.h,used:n*v.w+(n-1)*p.gx}:null}).filter(Boolean).sort((x,y)=>y.score-x.score||y.used-x.used);if(!candidates.length)break;let c=candidates[0],v=a[c.i],x=(p.W-c.used)/2;rows.push({i:c.i,n:c.n,x,y,w:v.w,h:v.h});counts[c.i]+=c.n;rem[c.i]-=c.n;y+=v.h+p.gy}if(!rows.length)break;boards.push({rows,counts})}let done=a.map((v,i)=>v.q-rem[i]);let text=`预计需要 ${boards.length} 版；共排 ${done.reduce((s,n)=>s+n,0)} 个\n`+a.map((v,i)=>`图案${i+1}（${v.w} × ${v.h} cm）：需求 ${v.q} 个，已排 ${done[i]} 个，剩余 ${rem[i]} 个`).join('\n')+'\n'+boards.map((b,i)=>`第 ${i+1} 版：`+b.rows.map(r=>`图案${r.i+1} × ${r.n}`).join('；')).join('\n');if(rem.some(n=>n))text+='\n注意：最多展示 1000 版，仍有未排数量。';render(text,makeSvg(p,boards[0]?.rows||[]))}catch(e){alert(e.message)}}function copyResult(){navigator.clipboard?.writeText(lastText).then(()=>alert('已复制'),()=>alert('复制失败，请手动选择文字'))}function exportSVG(){if(!lastSvg)return;let b=new Blob([lastSvg],{type:'image/svg+xml'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='拼版示意.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
let sameBoards=[],samePage=0,sameParams=null,sameItemsData=[];
function addSameItem(name='',qty=''){
 const root=$('sameItems');if(root.children.length>=30){alert('最多30种图案');return;}
 const el=document.createElement('div');el.className='item';
 el.innerHTML='<div class="itemhead"><strong>图案 <span class="sameNum"></span></strong><button class="danger" type="button">删除</button></div><div class="grid"><div><label>图案名称</label><input class="sameName" placeholder="例如 A"></div><div><label>目标数量 (个)</label><input class="sameQty" type="number" step="1" min="1"></div></div>';
 el.querySelector('.sameName').value=name;el.querySelector('.sameQty').value=qty;
 el.querySelector('button').onclick=()=>{el.remove();renumberSame()};root.appendChild(el);renumberSame();
}
function renumberSame(){document.querySelectorAll('.sameNum').forEach((e,i)=>e.textContent=i+1)}
addSameItem('A','20');addSameItem('B','15');addSameItem('C','10');
function calculateSame(){
 try{
  const p=params(),w=num('sameW'),h=num('sameH');
  if(!Number.isFinite(w)||!Number.isFinite(h)||w<=0||h<=0)throw Error('请输入有效的统一宽高。');
  const items=[...document.querySelectorAll('#sameItems .item')].map((el,i)=>({name:el.querySelector('.sameName').value.trim()||'图案'+(i+1),q:Number(el.querySelector('.sameQty').value)}));
  if(!items.length||items.some(x=>!Number.isInteger(x.q)||x.q<=0))throw Error('请至少添加一种图案，并填写正整数数量。');
  const cols=Math.floor((p.avail+p.gx+1e-9)/(w+p.gx));
  const rows=Math.floor((p.H+p.gy+1e-9)/(h+p.gy));
  if(cols<1||rows<1)throw Error('图案无法放入当前画板，请检查尺寸、间距和留边。');
  const target=items.reduce((a,x)=>a+x.q,0);
  // 首先最小化所需版数，然后在相同版数下优先选横向接近画板宽度的行列。
  const candidates=[];
  for(let c=1;c<=Math.min(cols,target);c++)for(let r=1;r<=Math.min(rows,Math.ceil(target/c));r++){
   const per=c*r,n=Math.ceil(target/per),width=c*w+(c-1)*p.gx,height=r*h+(r-1)*p.gy;
   candidates.push({c,r,per,n,width,height,waste:n*per-target});
  }
  candidates.sort((a,b)=>a.n-b.n||a.waste-b.waste||b.width-a.width||b.per-a.per);
  const best=candidates[0];
  const queue=[];items.forEach((x,i)=>{for(let j=0;j<x.q;j++)queue.push(i)});
  const boards=[];let offset=0;
  while(offset<queue.length){boards.push(queue.slice(offset,offset+best.per));offset+=best.per}
  sameBoards=boards;samePage=0;sameParams={...p,...best,w,h};sameItemsData=items;
  const totals=items.map((x,i)=>`${x.name}：${x.q} 个`).join('；');
  const report=`推荐：${best.c} 列 × ${best.r} 行，${boards.length} 版（最后一版允许留空）\n每版最多 ${best.per} 个；目标总数 ${target} 个；实际 ${queue.length} 个，误差 0\n各图案：${totals}\n图案尺寸：${fmt(w)} × ${fmt(h)} cm；画板：${fmt(p.W)} × ${fmt(p.H)} cm\n横向排布 ${fmt(best.width)} cm；纵向排布 ${fmt(best.height)} cm；横向总余量 ${fmt(p.W-best.width)} cm\n间距：横向 ${fmt(p.gx)} cm，纵向 ${fmt(p.gy)} cm\n每张画板使用统一行列规格，最后一版可能未排满；图案不旋转。`;
  render(report,makeSameSvg(0));$('boardControls').classList.remove('hidden');updateSamePosition();
 }catch(e){alert(e.message)}
}
function makeSameSvg(index){
 const p=sameParams,items=sameBoards[index];if(!p||!items)return '';
 const scale=Math.min(4,540/Math.max(p.W,p.H)),W=p.W*scale,H=p.H*scale;
 const colors=['#7295ee','#efa97b','#8cc8ac','#c1a1e9','#f2d276','#86c6df','#f3a8bc'];
 let out=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="white"/><rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="#283c5d" stroke-width="1.2"/>`;
 const x0=(p.W-p.width)/2,y0=(p.H-p.height)/2;
 items.forEach((id,k)=>{const c=k%p.c,r=Math.floor(k/p.c),x=(x0+c*(p.w+p.gx))*scale,y=(y0+r*(p.h+p.gy))*scale;
  out+=`<rect x="${x}" y="${y}" width="${p.w*scale}" height="${p.h*scale}" fill="${colors[id%colors.length]}" stroke="#334b70" stroke-width=".5"/><text x="${x+p.w*scale/2}" y="${y+p.h*scale/2}" dominant-baseline="middle" text-anchor="middle" font-size="${Math.min(12,Math.max(4,p.w*scale/3))}" fill="#213047">${id+1}</text>`;
 });return out+'</svg>';
}
function updateSamePosition(){
 const items=sameBoards[samePage]||[];const counts=sameItemsData.map((x,i)=>`${x.name} ${items.filter(j=>j===i).length}个`).filter(x=>!x.endsWith(' 0个'));
 $('boardPosition').textContent=`第 ${samePage+1} / ${sameBoards.length} 版`;
 $('drawing').innerHTML=`<h4>第 ${samePage+1} 版排布示意</h4>`+makeSameSvg(samePage)+`<p class="note">${counts.join('；')}。图中编号对应输入顺序。</p>`;
 lastSvg=makeSameSvg(samePage);
}
function showBoard(delta){if(!sameBoards.length)return;samePage=Math.max(0,Math.min(sameBoards.length-1,samePage+delta));updateSamePosition()}
</script></body></html>
